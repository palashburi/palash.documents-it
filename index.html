  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f2f4f7;
      --bg2:       #e8ecf2;
      --ink:       #0f1624;
      --ink-mid:   #3d4e63;
      --ink-faint: #8a9ab5;
      --accent:    #2d6be4;
      --accent2:   #1a4fa8;
      --border:    #d0d8e8;
      --font:      'Space Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.8;
      overflow: hidden;
    }
    #root { height: 100%; display: flex; flex-direction: column; }

    /* ── Top bar ── */
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 16px 32px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      user-select: none;
      flex-wrap: wrap;
    }
    .topbar-logo { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -0.04em; margin-right: 4px; }
    .topbar-logo span { color: var(--accent); }
    .topbar-slash { color: var(--ink-faint); font-size: 15px; padding: 0 6px; font-weight: 400; }
    .nav-link { font-size: 13px; font-weight: 400; color: var(--ink-faint); cursor: pointer; padding: 1px 0; border-bottom: 1px solid transparent; }
    .nav-link:hover { color: var(--ink); }
    .nav-link.active { color: var(--ink); border-bottom-color: var(--accent); }

    @media (max-width: 600px) {
      .topbar { padding: 12px 16px 10px; }
      .topbar-logo { font-size: 13px; }
      .nav-link { font-size: 11px; }
      .topbar-slash { padding: 0 3px; font-size: 12px; }
    }

    /* ── Content — centered on desktop ── */
    .content-wrapper { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
    .content-wrapper::-webkit-scrollbar { width: 4px; }
    .content-wrapper::-webkit-scrollbar-track { background: transparent; }
    .content-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .content { width: 100%; max-width: 720px; padding: 48px 32px 72px; }

    @media (max-width: 768px) { .content { padding: 32px 20px 60px; } }
    @media (max-width: 480px) { .content { padding: 22px 16px 48px; } }

    /* ── Section header ── */
    .section-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
    .section-title { font-size: 26px; font-weight: 700; letter-spacing: -0.05em; color: var(--ink); line-height: 1.1; margin-bottom: 32px; }

    /* ── Tag pill ── */
    .tag-pill {
      display: inline-block; font-size: 9px; color: var(--accent);
      background: rgba(45,107,228,0.08); border: 1px solid rgba(45,107,228,0.2);
      padding: 2px 7px; border-radius: 2px; font-style: italic; white-space: nowrap; letter-spacing: 0.03em;
    }

    /* ── Tag input ── */
    .tag-input-wrap {
      display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 2px;
      padding: 6px 10px; min-height: 38px;

    .tag-input-wrap:focus-within { border-color: var(--accent); }

    /* ── Notes list ── */

    /* ── Reader ── */

    .reader-body p { margin-bottom: 20px; }

    /* ── Me ── */

    /* ── Proj ── */

    .proj-name { font-size: 13px; font-weight: 700; color: var(--ink); }

    /* ── Game ── */

    .ed-input:focus { border-color: var(--accent); }
    .ed-actions { display: flex; gap: 12px; align-items: center; }
    .btn-p { font-family: var(--font); font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border: none; padding: 9px 20px; border-radius: 2px; cursor: pointer; }
    .btn-p:hover { background: var(--accent2); }
    .btn-g { font-family: var(--font); font-size: 12px; color: var(--ink-faint); background: transparent; border: none; padding: 9px 0; cursor: pointer; }
    .btn-g:hover { color: var(--ink-mid); }
    .proj-add-btn { font-family: var(--font); font-size: 11px; color: var(--ink-faint); background: transparent; border: 1px solid var(--border); padding: 5px 12px; border-radius: 2px; cursor: pointer; }
    .proj-add-btn:hover { border-color: var(--accent); color: var(--accent); }
    .proj-editor-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 3px; padding: 20px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
    .free-editor[data-placeholder]:empty:before { content: attr(data-placeholder); color: var(--ink-faint); pointer-events: none; position: absolute; }

    /* ── Dark mode — cool deep navy ── */
    body.dark-mode { background: #070b14; }
    body.dark-mode .topbar { background: #070b14; border-bottom-color: #111928; }
    body.dark-mode .content-wrapper { background: #070b14; }

    body.dark-mode .nav-link { color: #2e4468; }
    body.dark-mode .nav-link:hover { color: #c0d4f8; }
    body.dark-mode .nav-link.active { color: #6ea4f0; border-bottom-color: #3a70d8; }

    body.dark-mode .proj-desc { color: #3d5880; }

    body.dark-mode .tag-pill { background: rgba(110,164,240,0.08); border-color: rgba(110,164,240,0.18); color: #6ea4f0; }
    body.dark-mode .tag-pill-rm { background: rgba(110,164,240,0.08); border-color: rgba(110,164,240,0.18); color: #6ea4f0; }
    body.dark-mode .tag-input-wrap { background: #0c1220; border-color: #111928; }
    body.dark-mode .tag-input-wrap input { color: #c0d4f8; }

    body.dark-mode .section-label { color: #1c2e48; }
    body.dark-mode .reader-meta span { color: #2e4468; }
    body.dark-mode .reader-body { color: #8aaccf; }
    body.dark-mode .game-btn { background: #1a3870; color: #90c0f8; }
    body.dark-mode .game-btn:hover { background: #224898; }
    body.dark-mode .btn-p { background: #1a3870; color: #90c0f8; }
    body.dark-mode .btn-p:hover { background: #224898; }

    /* ── Tweaks panel ── */
    .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:260px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(242,244,247,.94);color:#0f1624;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:.5px solid rgba(255,255,255,.7);border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 12px 40px rgba(15,22,36,.14);font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SK_NOTES  = "palash_notes_v3";
const SK_PROJS  = "palash_projs_v3";
const SK_TWEAKS = "palash_tweaks_v2";

const load = (k, def) => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : def; } catch { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const EDITOR_PASSWORD = "Piyushuma@2009";
const isEditUnlocked = () => sessionStorage.getItem("palash_edit") === "1";
const unlockEdit = () => sessionStorage.setItem("palash_edit", "1");

// ── Tag input ─────────────────────────────────────────────────────────────────
function TagInput({ tags, onChange, placeholder = "add tag · enter" }) {
  const [input, setInput] = useState("");
  const add = val => { const t = val.trim().toLowerCase(); if (t && !tags.includes(t)) onChange([...tags, t]); setInput(""); };
  const rm = t => onChange(tags.filter(x => x !== t));
  return (
    <div className="tag-input-wrap">
      {tags.map(t => (
        <span key={t} className="tag-pill-rm">{t}<button onClick={() => rm(t)}>✕</button></span>
      ))}
      <input value={input} onChange={e => setInput(e.target.value)}
        onKeyDown={e => {
          if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(input); }
          if (e.key === "Backspace" && !input && tags.length) rm(tags[tags.length - 1]);
        }}
        onBlur={() => { if (input.trim()) add(input); }}
        placeholder={tags.length === 0 ? placeholder : ""} />
    </div>
  );
}

// ── Default data ──────────────────────────────────────────────────────────────
const defaultNotes = [
  { id: 1, date: "2026-04-28", title: "on not knowing things — and why that's fine", tags: ["thought","research"], html: null, body: "There's this weird pressure in the research world to always have an answer ready. Someone asks about your work and you're expected to give a crisp three-sentence summary with clear implications.\n\nBut most of the time, honest research is not knowing things. You poke at a problem from five angles, three of them don't work, one is promising but half-broken, and the last one you haven't tried yet because you're scared it won't work either.\n\nI've been thinking about this more since my last database rabbit hole. I went in to understand a simple query planner behavior and ended up three hours deep in the internals of B-tree page splits. Unplanned. It happens every time.\n\nI think the not-knowing is the point. The detour is the thing." },
  { id: 2, date: "2026-04-11", title: "vector embeddings are just vibes, actually", tags: ["ml","thought"], html: null, body: "People act like embeddings are arcane magic. They're not. They're just the model's compressed opinion of what something means, squished into a few hundred numbers.\n\nThe trick is that two semantically similar things end up close together in that space — not because we told it so, but because the training objective forced the model to cluster them that way.\n\nOnce you accept that embeddings are basically vibes-as-numbers, a lot of their failure modes start making sense. Garbage in, garbage out — but the garbage is subtle." },
  { id: 3, date: "2026-03-22", title: "databases as a thinking tool", tags: ["databases"], html: null, body: "The more I use SQL as an exploratory tool — not just for production queries — the more I think it's one of the most underrated ways to think about data.\n\nThere's something about forcing yourself to express a question as a relational operation that clarifies the question itself. You can't ask a fuzzy question in SQL. You have to be precise.\n\nWindow functions in particular feel like a superpower. The first time you really understand PARTITION BY, something shifts. You stop thinking in loops and start thinking in sets." },
  { id: 4, date: "2026-02-14", title: "research is mostly waiting, poorly", tags: ["research"], html: null, body: "A disproportionate chunk of research time is just waiting. Waiting for runs to finish. Waiting for reviews. Waiting for yourself to have the right idea.\n\nThe productive version of waiting is when you use that slack to read tangentially, to wander. The unproductive version is doomscrolling and convincing yourself it's procrastination with benefits.\n\nI haven't solved this. But I've noticed that the best ideas usually come during the wandering, not the focused work. So maybe the waiting is load-bearing." },
];

const defaultProjs = [
  { id: 1, name: "mystuff",     desc: "The note-taking backend behind this blog. Write, attach images, publish. Nothing more.", stack: ["go","sqlite","htmx"],           status: "live", link: "" },
  { id: 2, name: "tiny-vec",    desc: "A minimal vector similarity search from scratch. No libraries, just the math.",          stack: ["python","numpy","ml"],          status: "wip",  link: "" },
  { id: 3, name: "query-trace", desc: "A visual query plan explorer for PostgreSQL. Drag nodes, inspect cost estimates.",       stack: ["typescript","react","postgres"], status: "wip",  link: "" },
  { id: 4, name: "readinglist", desc: "A dead-simple reading list. Drop a link, add a one-liner. Just chronological.",         stack: ["sqlite","go"],                  status: "live", link: "" },
];

// ── Image resize helper ───────────────────────────────────────────────────────
function makeResizeHandler(el) {
  let toolbar = null;
  const removeToolbar = () => { if (toolbar) { toolbar.remove(); toolbar = null; } };
  const onClick = e => {
    if (e.target.tagName === "IMG") {
      removeToolbar();
      const img = e.target;
      toolbar = document.createElement("div");
      toolbar.style.cssText = "position:absolute;display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:3px;padding:3px 6px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.1);";
      [["S","33%"],["M","60%"],["F","100%"]].forEach(([lbl, w]) => {
        const btn = document.createElement("button");
        btn.textContent = lbl;
        btn.style.cssText = "background:transparent;border:none;cursor:pointer;color:var(--ink-mid);padding:2px 8px;font-family:var(--font);font-size:10px;border-radius:2px;";
        btn.onmouseenter = () => btn.style.background = "var(--border)";
        btn.onmouseleave = () => btn.style.background = "transparent";
        btn.onclick = ev => { ev.stopPropagation(); img.style.width = w; img.style.maxWidth = "100%"; removeToolbar(); };
        toolbar.appendChild(btn);
      });
      const rect = img.getBoundingClientRect(); const edRect = el.getBoundingClientRect();
      toolbar.style.position = "absolute";
      toolbar.style.top  = (rect.top  - edRect.top  + el.scrollTop  - 36) + "px";
      toolbar.style.left = (rect.left - edRect.left) + "px";
      el.style.position = "relative"; el.appendChild(toolbar);
    } else { removeToolbar(); }
  };
  el.addEventListener("click", onClick);
  return () => { el.removeEventListener("click", onClick); removeToolbar(); };
}

// ── NotesSection ──────────────────────────────────────────────────────────────
function NotesSection({ canEdit }) {
  const [notes, setNotes] = useState(() => {
    const d = load(SK_NOTES, null);
    if (!d) return defaultNotes;
    return d.map(n => ({ ...n, tags: n.tags || (n.tag ? [n.tag] : ["note"]) }));
  });
  const [view, setView]           = useState("list");
  const [openId, setOpenId]       = useState(null);
  const [editingId, setEditId]    = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [modalTitle, setMTitle]   = useState("");
  const [modalTags, setMTags]     = useState([]);
  const [filterTag, setFilterTag] = useState(null);
  const editorRef                 = useRef(null);
  const titleInputRef             = useRef(null);
  const cleanupRef                = useRef(null);

  const editorRefCb = useCallback(el => {
    if (cleanupRef.current) { cleanupRef.current(); cleanupRef.current = null; }
    editorRef.current = el;
    if (el) cleanupRef.current = makeResizeHandler(el);
  }, []);

  const persist = n => { setNotes(n); save(SK_NOTES, n); };
  const goList  = () => { setView("list"); setOpenId(null); setEditId(null); setShowModal(false); };
  const goWrite = () => { setEditId(null); setView("write"); setTimeout(() => { if (editorRef.current) editorRef.current.innerHTML = ""; }, 0); };
  const goEdit  = note => {
    setEditId(note.id); setView("write");
    setTimeout(() => {
      if (editorRef.current)
        editorRef.current.innerHTML = note.html || (note.body ? note.body.split(/\n\n+/).map(p => `<p>${p}</p>`).join("") : "");
    }, 0);
  };

  const onPublishClick = () => {
    const html = editorRef.current ? editorRef.current.innerHTML.trim() : "";
    if (!html) return;
    if (editingId) {
      const ex = notes.find(n => n.id === editingId);
      setMTitle(ex ? ex.title : ""); setMTags(ex ? (ex.tags || []) : []);
    } else { setMTitle(""); setMTags([]); }
    setShowModal(true);
    setTimeout(() => { if (titleInputRef.current) titleInputRef.current.focus(); }, 50);
  };

  const confirmPublish = () => {
    if (!modalTitle.trim()) return;
    const html = editorRef.current ? editorRef.current.innerHTML : "";
    const finalTags = modalTags.length ? modalTags : ["note"];
    if (editingId) {
      persist(notes.map(n => n.id === editingId ? { ...n, title: modalTitle.trim(), tags: finalTags, html } : n));
      setOpenId(editingId);
    } else {
      const n = { id: Date.now(), date: new Date().toISOString().slice(0, 10), title: modalTitle.trim(), tags: finalTags, html };
      persist([n, ...notes]); setOpenId(n.id);
    }
    setShowModal(false); setEditId(null); setView("read");
  };

  const del = id => { persist(notes.filter(n => n.id !== id)); goList(); };

  const insertImage = file => {
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = document.createElement("img");
      img.src = ev.target.result;
      img.style.cssText = "width:100%;max-width:100%;border-radius:3px;margin:14px 0;display:block;border:1px solid var(--border);cursor:pointer;";
      const sel = window.getSelection();
      if (sel && sel.rangeCount && editorRef.current && editorRef.current.contains(sel.getRangeAt(0).commonAncestorContainer)) {
        const range = sel.getRangeAt(0); range.deleteContents(); range.insertNode(img);
        range.setStartAfter(img); range.collapse(true); sel.removeAllRanges(); sel.addRange(range);
      } else if (editorRef.current) { editorRef.current.appendChild(img); }
    };
    reader.readAsDataURL(file);
  };

  const allTags = [...new Set(notes.flatMap(n => n.tags))].sort();
  const filtered = filterTag ? notes.filter(n => n.tags.includes(filterTag)) : notes;

  // Write view
  if (view === "write") return (
    <div style={{ position: "relative" }}>
      <div className="section-label">01 / writings</div>
      <div className="section-title" style={{ marginBottom: 16 }}>{editingId ? "editing" : "write"}</div>
      {showModal && (
        <div style={{ position:"fixed",inset:0,background:"rgba(7,11,20,0.65)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center" }}
          onClick={e => { if (e.target === e.currentTarget) setShowModal(false); }}>
          <div style={{ background:"var(--bg)",border:"1px solid var(--border)",borderRadius:4,padding:"32px 36px",width:380,display:"flex",flexDirection:"column",gap:16 }}>
            <div style={{ fontSize:13,fontWeight:700,letterSpacing:"-0.03em",color:"var(--ink)",marginBottom:4 }}>before you publish</div>
            <div>
              <div className="ed-label">title</div>
              <input ref={titleInputRef} className="ed-input" value={modalTitle} onChange={e => setMTitle(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") confirmPublish(); }}
                placeholder="give it a name" style={{ fontSize:14,fontWeight:700 }} autoFocus />
            </div>
            <div>
              <div className="ed-label">tags (press enter)</div>
              <TagInput tags={modalTags} onChange={setMTags} placeholder="ml · databases · thought…" />
            </div>
            <div className="ed-actions" style={{ paddingTop:4 }}>
              <button className="btn-p" onClick={confirmPublish}>{editingId ? "save" : "publish"}</button>
              <button className="btn-g" onClick={() => setShowModal(false)}>cancel</button>
            </div>
          </div>
        </div>
      )}
      <div style={{ maxWidth:680 }}>
        <div ref={editorRefCb} className="free-editor" contentEditable suppressContentEditableWarning
          data-placeholder="write freely. paste or drop images anywhere."
          onPaste={e => { const items = e.clipboardData && e.clipboardData.items; if (!items) return; for (const item of items) { if (item.type.startsWith("image/")) { e.preventDefault(); insertImage(item.getAsFile()); return; } } }}
          onDrop={e => { e.preventDefault(); insertImage(e.dataTransfer.files[0]); }}
          onDragOver={e => e.preventDefault()}
          style={{ minHeight:400,outline:"none",fontSize:13,lineHeight:2.1,color:"var(--ink)",caretColor:"var(--accent)",wordBreak:"break-word",position:"relative" }} />
        <div className="ed-actions" style={{ borderTop:"1px solid var(--border)",paddingTop:16,marginTop:16 }}>
          <button className="btn-p" onClick={onPublishClick}>{editingId ? "save…" : "publish…"}</button>
          <button className="btn-g" onClick={goList}>cancel</button>
        </div>
      </div>
    </div>
  );

  // Read view
  if (view === "read") {
    const note = notes.find(n => n.id === openId);
    if (!note) { goList(); return null; }
    return (
      <div className="reader">
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:36 }}>
          <span className="reader-back" onClick={goList}>← notes</span>
          {canEdit && (
            <div style={{ display:"flex",gap:14 }}>
              <button onClick={() => goEdit(note)} style={{ fontFamily:"var(--font)",fontSize:10,color:"var(--accent)",background:"transparent",border:"none",cursor:"pointer" }}>edit</button>
              <button onClick={() => del(note.id)} style={{ fontFamily:"var(--font)",fontSize:10,color:"var(--ink-faint)",background:"transparent",border:"none",cursor:"pointer" }}>delete</button>
            </div>
          )}
        </div>
        <div className="reader-title">{note.title}</div>
        <div className="reader-meta">
          <span>{note.date}</span>
          <span style={{ color:"var(--border)" }}>/</span>
          <span style={{ display:"flex",gap:4,flexWrap:"wrap" }}>
            {(note.tags || []).map(t => <span key={t} className="tag-pill">{t}</span>)}
          </span>
        </div>
        {note.html
          ? <div className="reader-body" dangerouslySetInnerHTML={{ __html: note.html }} />
          : note.body ? <div className="reader-body">{note.body.split(/\n\n+/).filter(Boolean).map((p,i) => <p key={i}>{p}</p>)}</div> : null}
      </div>
    );
  }

  // List view
  return (
    <div>
      <div className="section-label">01 / writings</div>
      <div style={{ display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:20 }}>
        <div className="section-title" style={{ marginBottom:0 }}>my_notes</div>
        {canEdit && <button onClick={goWrite} style={{ fontFamily:"var(--font)",fontSize:11,color:"var(--accent)",background:"transparent",border:"1px solid var(--accent)",padding:"5px 12px",borderRadius:2,cursor:"pointer" }}>+ write</button>}
      </div>
      {allTags.length > 0 && (
        <div style={{ display:"flex",flexWrap:"wrap",gap:5,marginBottom:20 }}>
          {allTags.map(t => (
            <button key={t} onClick={() => setFilterTag(filterTag === t ? null : t)}
              style={{ fontFamily:"var(--font)",fontSize:10,padding:"3px 10px",borderRadius:2,
                border:`1px solid ${filterTag===t?"var(--accent)":"var(--border)"}`,
                background:filterTag===t?"rgba(45,107,228,0.08)":"transparent",
                color:filterTag===t?"var(--accent)":"var(--ink-faint)",cursor:"pointer" }}>{t}</button>
          ))}
          {filterTag && <button onClick={() => setFilterTag(null)} style={{ fontFamily:"var(--font)",fontSize:10,padding:"3px 10px",border:"none",background:"transparent",color:"var(--ink-faint)",cursor:"pointer",textDecoration:"underline" }}>clear</button>}
        </div>
      )}
      <div>
        {filtered.map(n => (
          <div key={n.id} className="note-row" onClick={() => { setOpenId(n.id); setView("read"); }}>
            <div style={{ display:"flex",alignItems:"baseline",gap:10,width:"100%" }}>
              <span className="note-slash">/</span>
              <span className="note-title">{n.title}</span>
            </div>
            <div style={{ paddingLeft:18,display:"flex",gap:8,fontSize:11,color:"var(--ink-faint)",flexWrap:"wrap",alignItems:"center" }}>
              <span>{n.date}</span>
              <span style={{ color:"var(--border)" }}>·</span>
              <span style={{ display:"flex",gap:4 }}>{(n.tags||[]).map(t => <span key={t} className="tag-pill">{t}</span>)}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── GameSection — Simon Says ──────────────────────────────────────────────────
const BTNS = [
  { id:0, label:"A", color:"#2d6be4", glow:"rgba(45,107,228,0.45)" },
  { id:1, label:"B", color:"#16b89a", glow:"rgba(22,184,154,0.45)" },
  { id:2, label:"C", color:"#e4832d", glow:"rgba(228,131,45,0.45)" },
  { id:3, label:"D", color:"#a050c8", glow:"rgba(160,80,200,0.45)" },
];

function GameSection() {
  const [screen, setScreen]     = useState("start");
  const [seq, setSeq]           = useState([]);
  const [playerSeq, setPS]      = useState([]);
  const [activeBtn, setActiveBtn] = useState(null);
  const [level, setLevel]       = useState(0);
  const [best, setBest]         = useState(0);
  const [isShowing, setShowing] = useState(false);
  const [wrongId, setWrongId]   = useState(null);
  const tosRef                  = useRef([]);

  const clrTOs = () => { tosRef.current.forEach(clearTimeout); tosRef.current=[]; };
  const sleep = ms => new Promise(res => { const t=setTimeout(res,ms); tosRef.current.push(t); });
  const flash = useCallback(async (id, ms=520) => {
    setActiveBtn(id);
    await sleep(ms);
    setActiveBtn(null);
    await sleep(200);
  }, []);

  const playSeq = useCallback(async (s) => {
    setShowing(true); setPS([]);
    await sleep(600);
    for (const id of s) { await flash(id); }
    setShowing(false);
  }, [flash]);

  const start = useCallback(async () => {
    clrTOs();
    const first = [Math.floor(Math.random()*4)];
    setSeq(first); setPS([]); setLevel(1); setScreen("playing"); setWrongId(null);
    await playSeq(first);
  }, [playSeq]);

  const press = useCallback(async (id) => {
    if (isShowing || screen !== "playing") return;
    setActiveBtn(id); await sleep(200); setActiveBtn(null);
    const newPS = [...playerSeq, id];
    const idx = newPS.length - 1;
    if (newPS[idx] !== seq[idx]) {
      setWrongId(id); setShowing(true);
      setBest(b => Math.max(b, level-1));
      setTimeout(() => { setScreen("end"); setShowing(false); clrTOs(); }, 700);
      return;
    }
    setPS(newPS);
    if (newPS.length === seq.length) {
      setShowing(true);
      const next = [...seq, Math.floor(Math.random()*4)];
      setSeq(next); setLevel(l=>l+1); setPS([]);
      await sleep(500);
      await playSeq(next);
    }
  }, [isShowing, screen, playerSeq, seq, level, playSeq]);

  useEffect(() => () => clrTOs(), []);

  const progress = seq.length ? (playerSeq.length / seq.length) * 100 : 0;

  return (
    <div style={{ display:"flex",flexDirection:"column",gap:20 }}>
      <div className="section-label">04 / distraction</div>
      <div className="section-title">game_to_waste_time</div>

      {screen === "start" && (
        <div style={{ maxWidth:400 }}>
          <p style={{ fontSize:13,color:"var(--ink-mid)",lineHeight:1.9,marginBottom:6 }}><b style={{ color:"var(--ink)" }}>simon says.</b> watch the sequence light up.</p>
          <p style={{ fontSize:13,color:"var(--ink-mid)",lineHeight:1.9,marginBottom:24 }}>repeat it back in order. each round adds one step. how deep can you go?</p>
          <button className="game-btn" onClick={start}>start</button>
        </div>
      )}

      {(screen==="playing"||screen==="end") && (
        <div style={{ display:"flex",flexDirection:"column",gap:16,maxWidth:320 }}>
          <div style={{ display:"flex",gap:20,fontSize:11,color:"var(--ink-faint)" }}>
            <span>level <b style={{ color:"var(--ink)",fontSize:14 }}>{level}</b></span>
            <span>best <b style={{ color:"var(--ink)" }}>{best}</b></span>
            {screen==="playing" && <span style={{ color:isShowing?"var(--accent)":"var(--ink-faint)" }}>{isShowing?"watch…":"your turn"}</span>}
          </div>

          {screen==="playing" && !isShowing && (
            <div style={{ height:2,background:"var(--border)",borderRadius:1,overflow:"hidden" }}>
              <div style={{ height:"100%",width:`${progress}%`,background:"var(--accent)",transition:"width 0.2s",borderRadius:1 }} />
            </div>
          )}

          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
            {BTNS.map(b => {
              const on = activeBtn===b.id;
              const wrong = wrongId===b.id;
              return (
                <button key={b.id} onClick={() => press(b.id)} disabled={isShowing}
                  style={{
                    height:90, borderRadius:4, border:`2px solid ${on?b.color:"var(--border)"}`,
                    background: wrong?"#d94040" : on ? b.color : "var(--bg2)",
                    cursor: isShowing?"default":"pointer",
                    transition:"all 0.12s",
                    fontFamily:"var(--font)",fontSize:10,fontWeight:700,
                    color: on?"#fff":"var(--ink-faint)",
                    letterSpacing:"0.1em",
                    boxShadow: on ? `0 0 22px ${b.glow}` : "none",
                    transform: on ? "scale(1.04)" : "scale(1)",
                  }}>{b.label}</button>
              );
            })}
          </div>

          {screen==="end" && (
            <div style={{ paddingTop:4 }}>
              <div style={{ fontSize:20,fontWeight:700,color:"var(--ink)",marginBottom:6 }}>{level-1===0?"first try.":`level ${level-1}`}</div>
              <div style={{ fontSize:12,color:"var(--ink-faint)",marginBottom:18,fontStyle:"italic" }}>
                {level-1>=10?"impressive memory.":level-1>=5?"solid.":"it gets addictive."}
              </div>
              <button className="game-btn" onClick={start}>again</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── TweaksPanel ───────────────────────────────────────────────────────────────
function TweaksPanel({ open, onClose, tweaks, setTweak }) {
  const dragRef = useRef(null);
  const offRef = useRef({ x:16,y:16 });
  const PAD = 16;
  const clamp = useCallback(() => {
    const p=dragRef.current; if(!p) return;
    const w=p.offsetWidth, h=p.offsetHeight;
    offRef.current={ x:Math.min(Math.max(PAD,window.innerWidth-w-PAD),Math.max(PAD,offRef.current.x)), y:Math.min(Math.max(PAD,window.innerHeight-h-PAD),Math.max(PAD,offRef.current.y)) };
    p.style.right=offRef.current.x+"px"; p.style.bottom=offRef.current.y+"px";
  },[]);
  useEffect(() => {
    if(!open) return; clamp();
    const ro=typeof ResizeObserver!=="undefined"?new ResizeObserver(clamp):null;
    if(ro) ro.observe(document.documentElement); else window.addEventListener("resize",clamp);
    return () => { if(ro) ro.disconnect(); else window.removeEventListener("resize",clamp); };
  },[open,clamp]);
  const onDragStart = e => {
    const p=dragRef.current; if(!p) return;
    const r=p.getBoundingClientRect(), sx=e.clientX, sy=e.clientY;
    const sr=window.innerWidth-r.right, sb=window.innerHeight-r.bottom;
    const move=ev=>{ offRef.current={x:sr-(ev.clientX-sx),y:sb-(ev.clientY-sy)}; clamp(); };
    const up=()=>{ window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); };
    window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
  };
  if(!open||!tweaks) return null;
  return (
    <div ref={dragRef} className="twk-panel" style={{ right:offRef.current.x,bottom:offRef.current.y }}>
      <div className="twk-hd" onMouseDown={onDragStart}><b>Tweaks</b><button className="twk-x" onClick={onClose}>✕</button></div>
      <div className="twk-body">
        <div className="twk-sect">Theme</div>
        <div className="twk-row twk-row-h">
          <div className="twk-lbl"><span>Dark mode</span></div>
          <button type="button" className="twk-toggle" data-on={tweaks.dark?"1":"0"} onClick={()=>setTweak("dark",!tweaks.dark)}><i /></button>
        </div>
        <div className="twk-row twk-row-h">
          <div className="twk-lbl"><span>Accent</span></div>
          <input type="color" className="twk-swatch" value={tweaks.accent} onChange={e=>setTweak("accent",e.target.value)} />
        </div>
        <div className="twk-sect" style={{ paddingTop:8 }}>Type</div>
        <div className="twk-row">
          <div className="twk-lbl"><span>Font size</span><span className="twk-val">{tweaks.fontSize}px</span></div>
          <input type="range" className="twk-slider" min={12} max={20} step={1} value={tweaks.fontSize} onChange={e=>setTweak("fontSize",Number(e.target.value))} />
        </div>
      </div>
    </div>
  );
}

// ── Sticker ───────────────────────────────────────────────────────────────────
function Sticker({ onClick }) {
  return (
    <svg width="34" height="34" viewBox="0 0 44 44" fill="none" onClick={onClick} title="double-click to unlock editing" style={{ opacity:0.65,cursor:"default",flexShrink:0 }}>
      <circle cx="22" cy="22" r="20" fill="var(--bg2)" stroke="var(--border)" strokeWidth="1.2"/>
      <circle cx="22" cy="22" r="16" fill="none" stroke="var(--ink-faint)" strokeWidth="0.6" strokeDasharray="2.5 2"/>
      <rect x="13" y="18" width="14" height="10" rx="1.5" fill="none" stroke="var(--ink-mid)" strokeWidth="1.3"/>
      <path d="M27 20.5 Q31 20.5 31 23 Q31 25.5 27 25.5" fill="none" stroke="var(--ink-mid)" strokeWidth="1.3"/>
      <path d="M16 16 Q17 14 16 12.5" fill="none" stroke="var(--ink-faint)" strokeWidth="1.1" strokeLinecap="round"/>
      <path d="M19.5 16 Q20.5 14 19.5 12.5" fill="none" stroke="var(--ink-faint)" strokeWidth="1.1" strokeLinecap="round"/>
      <path d="M23 16 Q24 14 23 12.5" fill="none" stroke="var(--ink-faint)" strokeWidth="1.1" strokeLinecap="round"/>
      <path d="M11 29 Q22 32 33 29" fill="none" stroke="var(--ink-mid)" strokeWidth="1.1" strokeLinecap="round"/>
    </svg>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
const SECTIONS = [
  { id:"my_notes",           label:"my_notes" },
  { id:"me",                 label:"me" },
  { id:"proj",               label:"proj" },
  { id:"game_to_waste_time", label:"game_to_waste_time" },
];

const DEFAULT_TWEAKS = { accent:"#2d6be4", fontSize:14, dark:false };

function shadeColor(hex, pct) {
  try {
    const num = parseInt(hex.replace("#",""),16);
    const r=Math.min(255,Math.max(0,(num>>16)+pct));
    const g=Math.min(255,Math.max(0,((num>>8)&0xFF)+pct));
    const b=Math.min(255,Math.max(0,(num&0xFF)+pct));
    return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
  } catch { return hex; }
}

function App() {
  const [active, setActive]     = useState("my_notes");
  const [tweaks, setTweaksRaw]  = useState(() => load(SK_TWEAKS, DEFAULT_TWEAKS));
  const [showTweaks, setShowTw] = useState(false);
  const [canEdit, setCanEdit]   = useState(isEditUnlocked);
  const [authModal, setAuthMod] = useState(false);
  const [pwInput, setPwInput]   = useState("");
  const [pwError, setPwErr]     = useState(false);
  const stickerRef              = useRef({ count:0, timer:null });

  const setTweak = useCallback((key, val) => {
    setTweaksRaw(prev => { const next={...prev,[key]:val}; save(SK_TWEAKS,next); return next; });
  }, []);

  useEffect(() => {
    if (!tweaks) return;
    const r = document.documentElement;
    const acc = tweaks.dark ? "#4480e0" : tweaks.accent;
    r.style.setProperty("--accent",  acc);
    r.style.setProperty("--accent2", tweaks.dark ? "#264fa0" : shadeColor(tweaks.accent,-20));
    document.body.style.fontSize = tweaks.fontSize + "px";
    tweaks.dark ? document.body.classList.add("dark-mode") : document.body.classList.remove("dark-mode");
    const t = tweaks.dark
      ? { bg:"#070b14",bg2:"#0c1220",border:"#111928",ink:"#d8e8ff",mid:"#3d5880",faint:"#1c2e48" }
      : { bg:"#f2f4f7",bg2:"#e8ecf2",border:"#d0d8e8",ink:"#0f1624",mid:"#3d4e63",faint:"#8a9ab5" };
    r.style.setProperty("--bg",        t.bg);
    r.style.setProperty("--bg2",       t.bg2);
    r.style.setProperty("--border",    t.border);
    r.style.setProperty("--ink",       t.ink);
    r.style.setProperty("--ink-mid",   t.mid);
    r.style.setProperty("--ink-faint", t.faint);
  }, [tweaks]);

  const onStickerClick = () => {
    if (canEdit) { setShowTw(v=>!v); return; }
    const ref=stickerRef.current; ref.count+=1;
    if(ref.timer) clearTimeout(ref.timer);
    if(ref.count>=2) { ref.count=0; setAuthMod(true); setPwInput(""); setPwErr(false); }
    else { ref.timer=setTimeout(()=>{ ref.count=0; },500); }
  };

  const tryUnlock = () => {
    if(pwInput===EDITOR_PASSWORD) { unlockEdit(); setCanEdit(true); setAuthMod(false); }
    else { setPwErr(true); setPwInput(""); }
  };

  return (
    <div style={{ height:"100%",display:"flex",flexDirection:"column" }}>
      <header className="topbar">
        <span className="topbar-logo">palash<span>.</span></span>
        {SECTIONS.map(s => (
          <React.Fragment key={s.id}>
            <span className="topbar-slash">/</span>
            <span className={`nav-link${active===s.id?" active":""}`} onClick={()=>setActive(s.id)}>{s.label}</span>
          </React.Fragment>
        ))}
        <span style={{ marginLeft:"auto",display:"flex",alignItems:"center",gap:12 }}>
          <button onClick={()=>setTweak("dark",!tweaks.dark)} title={tweaks.dark?"light mode":"dark mode"}
            style={{ background:"transparent",border:"none",cursor:"pointer",color:tweaks.dark?"#4480e0":"var(--ink-faint)",fontSize:14,padding:0,lineHeight:1,opacity:0.9 }}>
            {tweaks.dark?"◐":"○"}
          </button>
          <Sticker onClick={onStickerClick} />
        </span>
      </header>

      <div className="content-wrapper">
        <main className="content">
          {active==="my_notes"           && <NotesSection canEdit={canEdit} />}
          {active==="me"                 && <MeSection />}
          {active==="proj"               && <ProjSection canEdit={canEdit} />}
          {active==="game_to_waste_time" && <GameSection />}
        </main>
      </div>

      <TweaksPanel open={showTweaks} onClose={()=>setShowTw(false)} tweaks={tweaks} setTweak={setTweak} />
      {canEdit && <div className="edit-badge">edit mode</div>}

      {authModal && (
        <div style={{ position:"fixed",inset:0,background:"rgba(7,11,20,0.65)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center" }}
          onClick={e=>{ if(e.target===e.currentTarget) setAuthMod(false); }}>
          <div style={{ background:"var(--bg)",border:"1px solid var(--border)",borderRadius:4,padding:"32px 36px",width:320,display:"flex",flexDirection:"column",gap:14 }}>
            <div style={{ fontSize:13,fontWeight:700,color:"var(--ink)" }}>unlock editing</div>
            <input autoFocus type="password" className="ed-input" value={pwInput} placeholder="password"
              onChange={e=>{ setPwInput(e.target.value); setPwErr(false); }}
              onKeyDown={e=>{ if(e.key==="Enter") tryUnlock(); if(e.key==="Escape") setAuthMod(false); }}
              style={{ borderColor:pwError?"#e04040":undefined }} />
            {pwError && <div style={{ fontSize:11,color:"#e04040" }}>wrong password</div>}
            <div className="ed-actions">
              <button className="btn-p" onClick={tryUnlock}>unlock</button>
              <button className="btn-g" onClick={()=>setAuthMod(false)}>cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
